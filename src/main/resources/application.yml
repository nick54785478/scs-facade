server:
  port: 8080

spring:
  application:
    name: scs-facade
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scs_facade}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

# SonarQube 集成配置
sonarqube:
  base-url: ${SONAR_HOST_URL:http://localhost:9000}
  token: ${SONAR_TOKEN:sqa_6a97d27b460dc2cfafb62a5c97b8defbc601f863}

# OpenAPI Swagger 介面配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  tags-sorter: alpha
  operations-sorter: method

# 低頻對帳排程配置 (Reconciliation Pull Mode)
scs:
  reconciliation:
    enabled: ${SCS_RECONCILIATION_ENABLED:true}
    cron: ${SCS_RECONCILIATION_CRON:0 0 2 * * ?}
    managed-projects: ${SCS_MANAGED_PROJECTS:scs-facade}
