server:
  port: 8080

spring:
  application:
    name: scs-facade
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scs_facade}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgre}
    password: ${DB_PASSWORD:postgre}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# SonarQube 集成配置
sonarqube:
  base-url: ${SONAR_HOST_URL:http://localhost:9000}
  token: ${SONAR_TOKEN:sqa_6a97d27b460dc2cfafb62a5c97b8defbc601f863}

# OpenAPI Swagger 介面配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
