server:
  port: 8080

spring:
  application:
    name: scs-facade
  datasource:
    url: jdbc:h2:mem:scsfacadedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# SonarQube 集成配置
sonarqube:
  base-url: http://localhost:9000
  token: default-dummy-token

# OpenAPI Swagger 介面配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
