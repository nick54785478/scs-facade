version: '3.8'

services:
  # ==========================================
  # 自建 GitLab 服務容器
  # ==========================================
  web:
    image: 'gitlab/gitlab-ce:latest'
    container_name: 'scs-gitlabci-web-1'
    hostname: 'scs-gitlab.local'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # 外部瀏覽器存取網址（維持 localhost:8888 供本地 Windows 瀏覽）
        external_url 'http://localhost:8888'

        # 允許 Docker 內網透過 web:8888 存取與 Clone
        gitlab_rails['gitlab_host'] = 'localhost'
        gitlab_rails['gitlab_port'] = 8888

        # 效能調校
        prometheus_monitoring['enable'] = false
        sidekiq['max_concurrency'] = 10
        puma['worker_processes'] = 2
    ports:
      - '8888:8888'
      - '2222:22'
    volumes:
      - './gitlab/config:/etc/gitlab'
      - './gitlab/logs:/var/log/gitlab'
      - './gitlab/data:/var/opt/gitlab'
    shm_size: '256m'
    networks:
      devops-net:
        aliases:
          - web
          - gitlab
          - scs-gitlab

  # ==========================================
  # GitLab CI Runner 服務容器
  # ==========================================
  runner:
    image: 'gitlab/gitlab-runner:latest'
    container_name: 'scs-gitlabci-runner-1'
    depends_on:
      - web
    volumes:
      # 掛載本地目錄：可在本機 ./runner-config/config.toml 直接編輯 Runner 設定
      - './runner-config:/etc/gitlab-runner'
      - '/var/run/docker.sock:/var/run/docker.sock'
    networks:
      - devops-net

  # ==========================================
  # SonarQube PostgreSQL 資料庫容器
  # ==========================================
  sonarqube-db:
    image: postgres:15-alpine
    container_name: 'scs-gitlabci-sonarqube-db-1'
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonarpassword
      POSTGRES_DB: sonarqube
    volumes:
      - scs_sonarqube_db_data:/var/lib/postgresql/data
    networks:
      devops-net:
        aliases:
          - sonarqube-db
          - scs-sonarqube-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # SonarQube 代碼分析伺服器容器
  # ==========================================
  sonarqube:
    image: sonarqube:lts-community
    container_name: 'scs-gitlabci-sonarqube-1'
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - '9000:9000'
    environment:
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonarpassword
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - scs_sonarqube_data:/opt/sonarqube/data
      - scs_sonarqube_extensions:/opt/sonarqube/extensions
      - scs_sonarqube_logs:/opt/sonarqube/logs
    networks:
      devops-net:
        aliases:
          - sonarqube
          - scs-sonarqube

  # ==========================================
  # SCS Facade PostgreSQL 資料庫容器
  # ==========================================
  scs-facade-db:
    image: postgres:15-alpine
    container_name: 'scs-facade-db-1'
    environment:
      POSTGRES_USER: postgre
      POSTGRES_PASSWORD: postgre
      POSTGRES_DB: scs_facade
    ports:
      - '5432:5432'
    volumes:
      - scs_facade_db_data:/var/lib/postgresql/data
    networks:
      devops-net:
        aliases:
          - scs-facade-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgre -d scs_facade"]
      interval: 5s
      timeout: 5s
      retries: 10

# ==========================================
# 專屬內部網路 (自訂名稱避免與其他專案重疊)
# ==========================================
networks:
  devops-net:
    name: scs_gitlabci_devops-net
    driver: bridge

# ==========================================
# 具名持久化磁碟區 (加前綴避免資料庫撞名覆蓋)
# ==========================================
volumes:
  scs_sonarqube_db_data:
  scs_sonarqube_data:
  scs_sonarqube_extensions:
  scs_sonarqube_logs:
  scs_facade_db_data: